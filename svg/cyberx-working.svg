<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-label="CyberX agents working status">
  <title>CyberX — agents working</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1A2E"/>
      <stop offset="100%" stop-color="#12283C"/>
    </linearGradient>
  </defs>

  <rect width="720" height="160" rx="16" fill="url(#card)" stroke="#1E3A52" stroke-width="2"/>

  <!-- Pulse ring -->
  <circle cx="72" cy="80" r="22" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.9">
    <animate attributeName="r" values="18;28;18" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="72" cy="80" r="12" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.55;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <text x="110" y="68" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="700" fill="#F8FAFC">Agents working</text>
  <text x="110" y="96" font-family="Consolas, Menlo, monospace"
        font-size="13" fill="#94A3B8">typing · scanning · laughing · shipping</text>

  <!-- Activity bars -->
  <g transform="translate(430, 48)" fill="#34D399">
    <rect x="0" y="40" width="14" height="24" rx="3">
      <animate attributeName="height" values="24;56;18;40;24" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;8;46;24;40" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="28" width="14" height="36" rx="3" fill="#22D3EE">
      <animate attributeName="height" values="36;20;52;28;36" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="28;44;12;36;28" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="34" width="14" height="30" rx="3" fill="#FACC15">
      <animate attributeName="height" values="30;48;22;40;30" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="34;16;42;24;34" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="22" width="14" height="42" rx="3" fill="#FB923C">
      <animate attributeName="height" values="42;26;50;32;42" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="22;38;14;32;22" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="36" width="14" height="28" rx="3" fill="#38BDF8">
      <animate attributeName="height" values="28;44;20;36;28" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="36;20;44;28;36" dur="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Status chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="11">
    <rect x="110" y="112" width="78" height="22" rx="6" fill="#12283C" stroke="#34D399" stroke-opacity="0.6"/>
    <circle cx="124" cy="123" r="4" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="134" y="127" fill="#34D399">ONLINE</text>

    <rect x="198" y="112" width="96" height="22" rx="6" fill="#12283C" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="210" y="127" fill="#22D3EE">SCAN READY</text>

    <rect x="304" y="112" width="110" height="22" rx="6" fill="#12283C" stroke="#FACC15" stroke-opacity="0.5"/>
    <text x="316" y="127" fill="#FACC15">CLONE SITE</text>
  </g>
</svg>
